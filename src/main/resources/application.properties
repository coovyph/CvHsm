# Application
spring.application.name=cv-hsm-gateway
server.port=8080
spring.grpc.client.my-service.secure=false

# gRPC server
grpc.server.port=9090
grpc.server.enable-keep-alive=true
grpc.server.keep-alive-time=300
grpc.server.keep-alive-timeout=60
grpc.server.security.enabled=false

# Thales HSM TCP client
#hsm.host=10.35.20.38
# Thales HSM Tcp Client Key Block
hsm.host=10.35.20.32
hsm.port=1500
hsm.max-sessions=4
hsm.connect-timeout-millis=5000
hsm.request-timeout-millis=5000
hsm.echo.enabled=true
hsm.echo.interval-millis=30000

# Logging (Log4j2)
logging.config=classpath:log4j2.xml

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Thales command properties
#hsm.cmd.type=variant
hsm.cmd.type=keyblock
